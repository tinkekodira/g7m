name: Prepare the Android project
description: >
  Java, Gradle, dependencies, the web build and `cap sync android` — everything
  before Gradle builds the app. Shared by native.yml (every pull request) and
  release.yml (tags), so a release is built exactly as the pull request was.
  Run actions/checkout first. ADR-0191.

inputs:
  anatomy-model-url:
    description: Signed link to the licensed anatomy model; empty draws the generated body.
    required: false
    default: ''
  supabase-url:
    description: VITE_SUPABASE_URL.
    required: true
  supabase-publishable-key:
    description: VITE_SUPABASE_PUBLISHABLE_KEY.
    required: true
  powersync-url:
    description: VITE_POWERSYNC_URL.
    required: true

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v5

    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # Capacitor 8 (AGP 8.13, compileSdk 36) builds against JDK 21. The runner
    # ships several; this pins the one Gradle uses rather than inheriting
    # whatever is default.
    - name: Install Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle
        cache-dependency-path: |
          apps/mobile/android/**/*.gradle*
          apps/mobile/android/gradle/wrapper/gradle-wrapper.properties

    # Fetch through the release API when the public download gateway is down.
    # The wrapper still verifies the pinned checksum and runs the build.
    - name: Download and verify Gradle
      shell: bash
      working-directory: apps/mobile/android
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        properties=gradle/wrapper/gradle-wrapper.properties
        archive=$(sed -n 's|^distributionUrl=.*/||p' "$properties")
        version=${archive#gradle-}
        version=${version%-bin.zip}
        checksum=$(sed -n 's/^distributionSha256Sum=//p' "$properties")
        download="$HOME/.gradle/wrapper/ci-distributions/$archive"
        if ! echo "$checksum  $download" | sha256sum --check --status; then
          bash "$GITHUB_WORKSPACE/.github/scripts/download-release-asset.sh" \
            gradle/gradle-distributions "v$version" "$archive" "$download"
        fi
        echo "$checksum  $download" | sha256sum --check
        sed -i "s|^distributionUrl=.*|distributionUrl=file:$download|" "$properties"
        ./gradlew --no-daemon --version

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Same as Pages: a signed, expiring link to the licensed model, skipped
    # when the secret is absent (every fork). The app treats a missing model
    # as normal and draws the generated body instead. ADR-0009.
    - name: Anatomy model
      shell: bash
      working-directory: apps/web
      env:
        ANATOMY_MODEL_URL: ${{ inputs.anatomy-model-url }}
      run: |
        if [ -z "$ANATOMY_MODEL_URL" ]; then
          echo "No ANATOMY_MODEL_URL secret; building with the generated body."
          exit 0
        fi
        node scripts/install-anatomy-model.mjs "$ANATOMY_MODEL_URL"

    # Public by design: compiled into every bundle, and RLS is what protects
    # the data. Repository variables, not secrets, for that reason.
    - name: Build the web app
      shell: bash
      working-directory: apps/web
      env:
        VITE_SUPABASE_URL: ${{ inputs.supabase-url }}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.supabase-publishable-key }}
        VITE_POWERSYNC_URL: ${{ inputs.powersync-url }}
      run: pnpm exec vite build

    # `cap sync` also deletes the source maps from the copy, through the
    # `capacitor:copy:after` hook in apps/mobile/package.json. ADR-0187.
    - name: Copy it into the Android project
      shell: bash
      working-directory: apps/mobile
      run: pnpm exec cap sync android

    # The hook is a package.json script, so a rename would ship ~15 MB of
    # maps again without a single error. This is what notices.
    - name: No source maps in the app
      shell: bash
      working-directory: apps/mobile/android/app/src/main/assets/public
      run: |
        maps=$(find . -name '*.map')
        if [ -n "$maps" ]; then
          echo "::error::Source maps were copied into the Android app:"
          echo "$maps"
          exit 1
        fi
        du -sh .
