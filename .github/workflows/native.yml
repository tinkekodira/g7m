name: Native apps

# Builds the iOS and Android apps from the same web bundle Pages gets.
#
# Its own workflow, and not part of CI, for two reasons: it needs a JDK, an
# Android SDK and a Mac with Xcode, and it takes minutes rather than seconds.
# A lint result should never wait behind Gradle.
#
# What it is for: a build of the app for each phone, from a machine that has
# neither. Android uploads a debug APK, installable as it is. iOS uploads an
# unsigned IPA, which a tool on the owner's computer signs with their own Apple
# ID before putting it on their phone — no Apple Developer account, no Mac.
# See DECISIONS.md ADR-0074 and ADR-0075.

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/native.yml'
      - '.github/scripts/**'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      # Everything before Gradle, shared with release.yml so a tagged release is
      # built the way this pull request was. ADR-0191.
      - name: Prepare the Android project
        uses: ./.github/actions/android-web
        with:
          anatomy-model-url: ${{ secrets.ANATOMY_MODEL_URL }}
          supabase-url: ${{ vars.VITE_SUPABASE_URL }}
          supabase-publishable-key: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          powersync-url: ${{ vars.VITE_POWERSYNC_URL }}

      # The release bundle too, unsigned (no upload key here): the signing and
      # version settings in app/build.gradle only otherwise run on a tag.
      - name: Build the APK and the release bundle
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      # Installable straight from the artifact: Android allows a debug build
      # from an unknown source once the phone is told to.
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: g7m-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    name: iOS (unsigned IPA)
    # Capacitor 8 needs Xcode 26, and so does an App Store upload. macos-26
    # has it as the default; macos-15 still defaults to Xcode 16.
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      # The runner image picks the default Xcode, and images change under us.
      # Fail here, with a reason, rather than deep inside xcodebuild.
      - name: Check for Xcode 26 or newer
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')
          if [ "${major:-0}" -lt 26 ]; then
            echo "::error::Capacitor 8 needs Xcode 26+, this runner has Xcode $major."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Anatomy model
        working-directory: apps/web
        env:
          ANATOMY_MODEL_URL: ${{ secrets.ANATOMY_MODEL_URL }}
        run: |
          if [ -z "$ANATOMY_MODEL_URL" ]; then
            echo "No ANATOMY_MODEL_URL secret; building with the generated body."
            exit 0
          fi
          node scripts/install-anatomy-model.mjs "$ANATOMY_MODEL_URL"

      - name: Build the web app
        working-directory: apps/web
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_POWERSYNC_URL: ${{ vars.VITE_POWERSYNC_URL }}
        run: pnpm exec vite build

      # `cap sync` runs `pod install` itself, which is where a plugin added to
      # package.json becomes a pod in the workspace.
      - name: Copy it into the iOS project
        working-directory: apps/mobile
        run: pnpm exec cap sync ios

      # Same check as Android's, for the same reason.
      - name: No source maps in the IPA
        working-directory: apps/mobile/ios/App/App/public
        run: |
          maps=$(find . -name '*.map')
          if [ -n "$maps" ]; then
            echo "::error::Source maps were copied into the iOS app:"
            echo "$maps"
            exit 1
          fi
          du -sh .

      # A real device build, with signing switched off. Signing needs a
      # certificate and a provisioning profile, which need an Apple Developer
      # account; an unsigned build is still the whole app, and the tools that
      # install one on a phone sign it themselves with the owner's Apple ID.
      # See apps/mobile/README.md and ADR-0075.
      - name: Build for a device, unsigned
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild             -workspace App.xcworkspace             -scheme App             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

      # An .ipa is a zip with the app inside a folder called Payload. Nothing
      # more: this is the format Sideloadly, AltStore and Xcode all read.
      - name: Package the IPA
        working-directory: apps/mobile/ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -qry g7m-unsigned.ipa Payload
          ls -lh g7m-unsigned.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v7
        with:
          name: g7m-ios-unsigned
          path: apps/mobile/ios/App/g7m-unsigned.ipa
          retention-days: 14
