name: End-to-end

# The production web build in a real browser, against a fake backend that runs
# the real migrations and the real sync rules. See e2e/README.md and ADR-0067.
#
# Its own workflow rather than a job in ci.yml: it builds
# the app a second time and takes a few minutes, and a slow browser test should
# never be the reason a lint result arrives late.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Three shards, each building the app and running a third of the files
  # against its own fake backend. One job ran close to 200 browser tests on
  # one runner, and every red "Browser tests" for weeks was that job reaching
  # its deadline with the last few files unrun — `workout-upgrade` and
  # `workout` most often, being last in the alphabet — never a failed
  # assertion. Raising the deadline (12, 15, then 18 minutes) only moved the
  # cliff. A shard takes about a third of the time, so a slow runner has room.
  # See ADR-0180.
  e2e:
    name: Browser tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one red run shows everything that is wrong.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Includes browsers and OS libraries: no apt mirror downloads on every PR.
    # Keep this version in sync with @playwright/test in e2e/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host --init
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # The runner owns the mounted checkout; the container runs as root.
      # Allow only this workspace so pnpm's prepare hook can configure Git.
      - name: Trust the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile

      # Builds the app against the fake backend (playwright.config.ts,
      # `webServer`). Two workers share one backend, with separate accounts
      # and browser-scoped offline tests. Each shard has its own backend.
      - name: Run the browser tests
        run: pnpm --filter @g7m/e2e test --shard=${{ matrix.shard }}/3

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # The one check a pull request shows, under the name it has always had:
  # green only when every shard is.
  result:
    name: Browser tests (Playwright)
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every shard passed
        run: |
          echo "Shards: ${{ needs.e2e.result }}"
          test "${{ needs.e2e.result }}" = "success"
