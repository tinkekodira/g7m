<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">
  <!--
    The launch screen, dark theme.

    Square and much larger than any phone: the shells crop it to the screen,
    so everything worth seeing sits in the middle. Nothing but the mark —
    a splash is a held breath, not a page.
  -->
  <rect width="2732" height="2732" fill="#1F1E1D" />
  <g fill="#D97757" transform="translate(1366 1366) scale(1.15) translate(-512 -512)">
    <rect x="168" y="482" width="688" height="60" rx="30" />
    <rect x="330" y="312" width="92" height="400" rx="36" />
    <rect x="602" y="312" width="92" height="400" rx="36" />
    <rect x="222" y="382" width="76" height="260" rx="32" />
    <rect x="726" y="382" width="76" height="260" rx="32" />
  </g>
</svg>
