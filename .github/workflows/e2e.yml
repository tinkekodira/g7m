name: End-to-end

# The production web build in a real browser, against a fake backend that runs
# the real migrations and the real sync rules. See e2e/README.md and ADR-0067.
#
# Its own workflow rather than a job in ci.yml: it builds
# the app a second time and takes a few minutes, and a slow browser test should
# never be the reason a lint result arrives late.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-shard:
    name: Browser shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    # Includes browsers and OS libraries: no apt mirror downloads on every PR.
    # Keep this version in sync with @playwright/test in e2e/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host --init
    timeout-minutes: 15
    strategy:
      # Let both shards finish and retain diagnostics if either fails.
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v7

      # The runner owns the mounted checkout; the container runs as root.
      # Allow only this workspace so pnpm's prepare hook can configure Git.
      - name: Trust the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile

      # Builds the app against the fake backend (playwright.config.ts,
      # `webServer`). Each shard has its own backend and one serial worker;
      # backend-wide outage tests cannot interfere with the other shard.
      - name: Run the browser tests
        run: pnpm --filter @g7m/e2e test --shard=${{ matrix.shard }}/2

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  e2e:
    # Preserve the existing required check, and fail it unless BOTH shards pass.
    name: Browser tests (Playwright)
    needs: browser-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every browser shard to pass
        env:
          SHARD_RESULT: ${{ needs.browser-shard.result }}
        run: test "$SHARD_RESULT" = success
