[package]
name = "g7m"
version = "0.1.0"
description = "g7m — strength training: 3D anatomy explorer and offline workout logger."
authors = ["tinkekodira"]
license = "UNLICENSED"
repository = "https://github.com/tinkekodira/g7m"
publish = false
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
