name: End-to-end

# The production web build in a real browser, against a fake backend that runs
# the real migrations and the real sync rules. See e2e/README.md and ADR-0067.
#
# Its own workflow rather than a job in ci.yml: it installs a browser, builds
# the app a second time and takes a few minutes, and a slow browser test should
# never be the reason a lint result arrives late.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @g7m/e2e exec playwright install --with-deps chromium

      # Builds the app against the fake backend (playwright.config.ts,
      # `webServer`), starts the fake, and runs every test.
      - name: Run the browser tests
        run: pnpm --filter @g7m/e2e test

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
